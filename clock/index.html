<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><title>Clock — WEB DESK</title><link rel="stylesheet" href="../assets/styles.css"></head>
<body><main class="shell">
<header class="topbar"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span>Clock</span></a><div class="nav-actions"><a class="back-link" href="../">← Home</a></div></header>
<section class="hero"><div class="eyebrow">Time command center</div><h1>時間を、<br>ひと目で。</h1><p class="lead">現在時刻、世界時計、ストップウォッチ、タイマーをひとつの画面に。ブラウザを開くだけで使えます。</p></section>
<section class="panel clock-main"><div class="clock-time" id="main-time">--:--:--</div><div class="clock-date" id="main-date">---</div><div class="world-grid grid" id="world-grid"></div></section>
<div class="clock-tools">
  <section class="panel panel-pad"><div class="section-title"><div><h2>Stopwatch</h2><p>1/100秒表示</p></div></div><div class="timer-display" id="sw-display">00:00.00</div><div class="tool-buttons"><button class="primary-btn" id="sw-start">Start</button><button class="secondary-btn" id="sw-lap">Lap</button><button class="ghost-btn" id="sw-reset">Reset</button></div><div id="laps" class="history-list" style="margin-top:14px;max-height:210px"></div></section>
  <section class="panel panel-pad"><div class="section-title"><div><h2>Timer</h2><p>終了時にブラウザで通知音</p></div></div><div class="timer-display" id="timer-display">05:00</div><div class="tool-buttons"><button class="primary-btn" id="timer-start">Start</button><button class="ghost-btn" id="timer-reset">Reset</button></div><div class="preset-row"><button class="chip" data-min="1">1分</button><button class="chip active" data-min="5">5分</button><button class="chip" data-min="10">10分</button><button class="chip" data-min="25">25分</button><button class="chip" data-min="60">60分</button></div></section>
</div>
<footer class="footer"><span>Clock / browser time</span><span id="tz-label">—</span></footer>
</main><script src="./clock.js" defer></script></body></html>
