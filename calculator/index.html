<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018">
  <title>Calculator — WEB DESK</title><link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M7.5 7h9M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></span><span>Calculator</span></a><div class="nav-actions"><a class="back-link" href="../">← Home</a></div></header>
  <section class="hero"><div class="eyebrow">Fast scientific calculator</div><h1>速く、正確に、<br>履歴まで。</h1><p class="lead">四則演算・累乗・平方根・三角関数・対数に対応。キーボード入力と計算履歴も使えます。</p></section>
  <div class="calc-wrap">
    <section class="panel calc-panel">
      <div class="calc-display" aria-live="polite"><div class="calc-expression" id="expression">0</div><div class="calc-result" id="result">0</div></div>
      <div class="calc-mode"><button class="seg-btn active" data-angle="deg">DEG</button><button class="seg-btn" data-angle="rad">RAD</button><span class="small" style="margin-left:auto;align-self:center">Enter = 計算 / Esc = クリア</span></div>
      <div class="calc-grid" id="keys">
        <button class="calc-key danger" data-action="clear">AC</button><button class="calc-key" data-action="back">⌫</button><button class="calc-key op" data-value="(">(</button><button class="calc-key op" data-value=")">)</button><button class="calc-key op" data-value="/">÷</button>
        <button class="calc-key" data-value="sin(">sin</button><button class="calc-key" data-value="cos(">cos</button><button class="calc-key" data-value="tan(">tan</button><button class="calc-key" data-value="sqrt(">√</button><button class="calc-key op" data-value="^">xʸ</button>
        <button class="calc-key" data-value="7">7</button><button class="calc-key" data-value="8">8</button><button class="calc-key" data-value="9">9</button><button class="calc-key" data-value="pi">π</button><button class="calc-key op" data-value="*">×</button>
        <button class="calc-key" data-value="4">4</button><button class="calc-key" data-value="5">5</button><button class="calc-key" data-value="6">6</button><button class="calc-key" data-value="ln(">ln</button><button class="calc-key op" data-value="-">−</button>
        <button class="calc-key" data-value="1">1</button><button class="calc-key" data-value="2">2</button><button class="calc-key" data-value="3">3</button><button class="calc-key" data-value="log(">log</button><button class="calc-key op" data-value="+">+</button>
        <button class="calc-key" data-value="0">0</button><button class="calc-key" data-value=".">.</button><button class="calc-key" data-value="e">e</button><button class="calc-key" data-action="sign">±</button><button class="calc-key equal" data-action="equals">=</button>
      </div>
    </section>
    <aside class="panel panel-pad"><div class="section-title"><div><h3>History</h3><p>この端末にだけ保存</p></div><button class="ghost-btn" id="clear-history">消去</button></div><div class="history-list" id="history"></div><div class="empty hidden" id="history-empty">まだ計算履歴はありません。</div></aside>
  </div>
  <footer class="footer"><span>Calculator / local history</span><span>式の評価は独自パーサーで実行</span></footer>
</main>
<script src="./calculator.js" defer></script>
</body></html>
